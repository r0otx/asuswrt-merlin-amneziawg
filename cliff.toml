[changelog]
header = """
# Changelog\n\nAll notable changes to this project are documented here.\n
"""
body = """
{% if version %}## {{ version | trim_start_matches(pat="v") }} — {{ timestamp | date(format="%Y-%m-%d") }}
{% else %}## [Unreleased]
{% endif %}
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | upper_first }}
{% for commit in commits %}
- {{ commit.message | upper_first | trim }}{% if commit.breaking %} [**breaking**]{% endif %}
{% endfor %}
{% endfor %}
"""
trim = true

[git]
conventional_commits = true
filter_unconventional = false
commit_parsers = [
    { message = "^feat",     group = "Features" },
    { message = "^fix",      group = "Bug Fixes" },
    { message = "^perf",     group = "Performance" },
    { message = "^security", group = "Security" },
    { message = "^refactor", group = "Refactor" },
    { message = "^docs",     group = "Documentation" },
    { message = "^build",    group = "Build" },
    { message = "^ci",       group = "CI" },
    { message = "^test",     group = "Tests" },
    { message = "^chore",    skip  = true },
]
filter_commits = false
tag_pattern = "v[0-9]+.[0-9]+.[0-9]+(-[a-z]+\\.[0-9]+)?"
sort_commits = "oldest"
